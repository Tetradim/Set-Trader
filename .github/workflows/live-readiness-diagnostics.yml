name: Pulse Live Readiness Diagnostics

on:
  pull_request:
    branches: [Beta-Maximum]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/live-readiness-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r backend/requirements.txt
      - name: Run live-readiness tests with compact report
        id: tests
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          set +e
          python -m pytest \
            backend/tests/test_order_mode_routing.py \
            backend/tests/test_live_broker_truth_guards.py \
            backend/tests/test_live_execution_quality.py \
            backend/tests/test_live_terminal_fill.py \
            backend/tests/test_live_cycle_capital.py \
            backend/tests/test_order_lifecycle_state_machine.py \
            backend/tests/test_edge_execution_intent_v2.py \
            backend/tests/test_edge_handoff_idempotency.py \
            backend/tests/test_edge_handoff_runtime_wiring.py \
            backend/tests/test_live_position_publication.py \
            backend/tests/test_live_publication_resilience.py \
            backend/tests/test_frontend_live_ledger_wiring.py \
            -q --tb=short 2>&1 | tee pulse-live-readiness-tests.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compact test report
        uses: actions/upload-artifact@v4
        with:
          name: pulse-live-readiness-test-report
          path: pulse-live-readiness-tests.txt
          if-no-files-found: error
          retention-days: 14
      - name: Fail when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
