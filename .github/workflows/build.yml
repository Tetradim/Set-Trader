name: Build Sentinel Pulse

on:
  push:
    branches: [main, main-2, Sentinel-Prod, Beta-Maximum]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/runbooks/**'
      - '*.ps1'
      - 'setup.iss'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, main-2, Sentinel-Prod, Beta-Maximum]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/runbooks/**'
      - '*.ps1'
      - 'setup.iss'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version (semver)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: "Sentinel Pulse"
  VERSION: ${{ github.event.inputs.version || '1.0.0-beta' }}
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------
  # Readiness Job - gates installer packaging on live-trading safety checks
  # ---------------------------------------------------------------------
  readiness-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Live Trading Readiness Checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r backend/requirements.txt

      - name: Run backend readiness tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/test_release_security_static.py \
            backend/tests/test_preflight_static.py \
            backend/tests/test_settings_live_confirmation.py \
            backend/tests/test_order_mode_routing.py \
            backend/tests/test_engine_state_persistence.py \
            backend/tests/test_engine_stress_simulation.py \
            backend/tests/test_audit_service.py \
            -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------
  # Build Job - runs on Windows
  # ---------------------------------------------------------------------
  build:
    needs: readiness-checks
    runs-on: windows-latest
    timeout-minutes: 90
    name: Build Windows Installer

    steps:
      # ---------------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------------
      # 3. Install Node.js (for frontend build)
      # ---------------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---------------------------------------------------------------------
      # 4. Install Python dependencies
      # ---------------------------------------------------------------------
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r backend/requirements.txt
          pip install pyinstaller pillow

      # ---------------------------------------------------------------------
      # 5. Build frontend (React static files) — always rebuild in CI
      # ---------------------------------------------------------------------
      - name: Build frontend
        run: |
          Write-Host "=== Starting Frontend Build ===" -ForegroundColor Cyan
          cd frontend
          if (Test-Path node_modules) {
            Write-Host "Clearing npm cache..."
            npm cache clean --force
          }
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Installing npm packages from lockfile..."
          npm ci
          Write-Host "Running Vite build..."
          npm run build
          Write-Host "=== Frontend Build Complete ===" -ForegroundColor Green

      # ---------------------------------------------------------------------
      # 5b. Verify frontend build
      # ---------------------------------------------------------------------
      - name: Verify frontend build
        run: |
          if (!(Test-Path frontend/dist)) {
            Write-Host "ERROR: frontend/dist not found - frontend build failed"
            exit 1
          }
          Write-Host "Frontend build verified"

      # ---------------------------------------------------------------------
      # 6. Copy frontend build to backend static dir
      # ---------------------------------------------------------------------
      - name: Copy frontend to static
        run: |
          Remove-Item backend/static -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path frontend/dist -Destination backend/static -Recurse
          Write-Host "Frontend copied to backend/static"

      # ---------------------------------------------------------------------
      # 7. Create .env for bundled app
      # ---------------------------------------------------------------------
      - name: Create .env
        run: |
          @"
          MONGO_URL=mongodb://localhost:27017
          DB_NAME=sentinelpulse
          CORS_ORIGINS=http://localhost:8002,http://127.0.0.1:8002
          PORT=8002
          LOG_LEVEL=INFO
          SIMULATE_24_7=false
          "@ | Out-File -Encoding UTF8 backend/.env

      # ---------------------------------------------------------------------
      # 7. Build with PyInstaller — clear cache first
      # ---------------------------------------------------------------------
      - name: Build exe
        working-directory: backend
        run: |
          Write-Host "=== PyInstaller Build Starting ===" -ForegroundColor Cyan
          Write-Host "Clearing PyInstaller cache - FORCE..."
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item backend\build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item backend\dist -Recurse -Force -ErrorAction SilentlyContinue
          $cacheDir = "$env:LOCALAPPDATA\pyinstaller"
          if (Test-Path $cacheDir) {
            Write-Host "Removing PyInstaller cache..."
            Remove-Item $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Running PyInstaller..."
          python -m PyInstaller --clean sentinel_win.spec 2>&1 | Tee-Object -FilePath build.log
          Write-Host "=== Build log (last 50 lines) ===" -ForegroundColor Yellow
          Get-Content build.log -Tail 50
          Write-Host "=== PyInstaller Build Complete ===" -ForegroundColor Green

      # ---------------------------------------------------------------------
      # 8. Copy launcher scripts into package
      # ---------------------------------------------------------------------
      - name: Copy launchers into package
        shell: pwsh
        run: |
          $package = "backend\dist\SentinelPulse"
          if (!(Test-Path $package)) {
            Write-Host "ERROR: $package not found"
            exit 1
          }
          Copy-Item "Launch-Sentinel-Pulse.bat" "$package\Launch-Sentinel-Pulse.bat" -Force
          Copy-Item "Launch-Sentinel-Pulse.ps1" "$package\Launch-Sentinel-Pulse.ps1" -Force
          Copy-Item "Setup-And-Launch.bat" "$package\Setup-And-Launch.bat" -Force
          @"
          @echo off
          call "%~dp0Launch-Sentinel-Pulse.bat"
          "@ | Out-File -Encoding ASCII "$package\Start Sentinel Pulse.bat"
          Write-Host "First-run launchers copied into $package"

      # ---------------------------------------------------------------------
      # 9. Verify exe exists
      # ---------------------------------------------------------------------
      - name: Verify exe
        run: |
          $exe = "backend\dist\SentinelPulse\SentinelPulse.exe"
          if (!(Test-Path $exe)) {
            Write-Host "ERROR: $exe not found"
            Get-ChildItem -Path "backend\dist" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "SUCCESS: Built $exe"
          Get-Item $exe | Select-Object Name, @{N="Size(MB)";E={[math]::Round($_.Length/1MB,2)}}

      # ---------------------------------------------------------------------
      # 10. Install Inno Setup and build installer
      # ---------------------------------------------------------------------
      - name: Install Inno Setup and build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ /DVersion='${{ env.VERSION }}'

      # ---------------------------------------------------------------------
      # 11. Upload artifacts
      # ---------------------------------------------------------------------
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SentinelPulse-Beta-Setup-${{ env.VERSION }}
          path: dist/SentinelPulse*Setup*.exe
          if-no-files-found: error
          retention-days: 90

      # ---------------------------------------------------------------------
      # 12. Upload build log for debugging
      # ---------------------------------------------------------------------
      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: backend/build.log
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------------
      # 13. Copy log to desktop
      # ---------------------------------------------------------------------
      - name: Copy log to desktop
        run: |
          $desktop = [Environment]::GetFolderPath("Desktop")
          if (Test-Path "backend\build.log") {
            Copy-Item "backend\build.log" -Destination "$desktop\SentinelPulse-build.log" -Force
            Write-Host "Build log copied to desktop"
          }

      # - name: Upload Standalone Folder
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: SentinelPulse-Portable-${{ env.VERSION }}
      #     path: backend/dist/SentinelPulse
      #     retention-days: 30
