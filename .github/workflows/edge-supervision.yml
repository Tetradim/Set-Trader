name: Edge Supervision Contract

on:
  push:
    branches: [Beta-Maximum]
    paths:
      - 'backend/trading/edge_*contract_patch.py'
      - 'backend/trading/__init__.py'
      - 'backend/tests/test_edge_supervision_intent_v3.py'
      - 'backend/tests/test_edge_strategy_contract.py'
      - '.github/workflows/edge-supervision.yml'
  pull_request:
    branches: [Beta-Maximum]
    paths:
      - 'backend/**'
      - '.github/workflows/edge-supervision.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  supervision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark supervision checks pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"pending\",\"context\":\"Pulse Edge Supervision\",\"description\":\"Pulse Edge contract checks are running\",\"target_url\":\"${target_url}\"}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r backend/requirements.txt
      - name: Compile Edge communication runtime
        run: |
          python -m py_compile \
            backend/trading/edge_strategy_contract_patch.py \
            backend/trading/edge_handoff_contract_patch.py \
            backend/trading/__init__.py
      - name: Run supervision and handoff regressions
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/test_edge_supervision_intent_v3.py \
            backend/tests/test_edge_strategy_contract.py \
            backend/tests/test_edge_handoff_contract.py \
            backend/tests/test_edge_handoff_idempotency.py \
            backend/tests/test_order_mode_routing.py \
            -q --tb=short
      - name: Publish successful supervision status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"success\",\"context\":\"Pulse Edge Supervision\",\"description\":\"Pulse Edge contract checks passed\",\"target_url\":\"${target_url}\"}"
      - name: Publish failed supervision status
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"failure\",\"context\":\"Pulse Edge Supervision\",\"description\":\"Pulse Edge contract checks failed\",\"target_url\":\"${target_url}\"}"
