name: Edge Supervision Contract

on:
  pull_request:
    branches: [Beta-Maximum]
    paths:
      - 'backend/**'
      - '.github/workflows/edge-supervision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervision-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r backend/requirements.txt
      - name: Run supervision and handoff regressions
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/test_edge_supervision_intent_v3.py \
            backend/tests/test_edge_handoff_contract.py \
            backend/tests/test_edge_handoff_idempotency.py \
            backend/tests/test_order_mode_routing.py \
            -q --tb=short
